# docker-compose.yml - Production-ready configuration
#
# Usage:
#   docker-compose up -d        # Start in background
#   docker-compose logs -f      # Follow logs
#   docker-compose down         # Stop and remove
#   docker-compose down -v      # Stop and remove volumes
#
# First-time setup (requires local ./data directory with auth.db):
#   mkdir -p data
#   make auth-init              # Initialize auth database in ./data/auth.db
#   make auth-add-key ROLE=admin  # Generate API key (save it!)
#   docker-compose up -d        # Start with docker-compose.override.yml (mounts ./data)
#
# For production with named volumes (no override file):
#   docker-compose -f docker-compose.yml up -d
#   # Then exec into container to manage auth DB, or pre-populate the volume
#
# Environment variables (all optional, shown with defaults):
#   DUCKDB_PORT=8080
#   DUCKDB_ROUTE_PREFIX=/duckdb
#   DUCKDB_DATABASE_PATH=/data/main.db
#   DUCKDB_AUTH_DATABASE_PATH=/data/auth.db
#   DUCKDB_THREADS=4
#   DUCKDB_MEMORY_LIMIT=      (not set = 80% of RAM)
#   DUCKDB_QUERY_TIMEOUT=10s
#   DUCKDB_ACCESS_MODE=read_write
#   DUCKDB_MAX_ROWS_PER_PAGE=100
#   DUCKDB_ABSOLUTE_MAX_ROWS=10000
#   DUCKDB_FTS_SERVICE_URL=http://fts-sidecar:8701  (for full-text search)
#   DUCKDB_GGVISUAL_SERVICE_URL=http://ggvisual:8080 (for ggsql chart rendering; not yet
#                                                      consumed by the module itself -- see
#                                                      ggsql-endpoint.md for the client work
#                                                      still needed)
#   DUCKDB_CORS_ORIGINS=http://localhost:5522        (space-separated; use * for all origins)
#
# FTS Sidecar environment variables:
#   FTS_PORT=8701
#   FTS_INDEX_PATH=/data/fts
#   FTS_LOG_LEVEL=info
#
# ggvisual sidecar: no service-specific env vars (its flags are set via the container's own
# CMD/ENTRYPOINT -- see ../ggsql/cmd/ggvisual). Build the image first (not published to a
# registry): cd ../ggsql && podman build --target service -t localhost/ggvisual:latest -f Containerfile .

services:
  caddy-duckdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy-duckdb
    ports:
      - "${DUCKDB_PORT:-8080}:${DUCKDB_PORT:-8080}"
    volumes:
      - duckdb-data:/data
      - ./data/rendered_works.db:/data/main.db
    environment:
      # Timezone
      - TZ=UTC
      # DuckDB settings (uncomment to override defaults)
      # - DUCKDB_PORT=8080
      # - DUCKDB_ROUTE_PREFIX=/duckdb
      # - DUCKDB_DATABASE_PATH=/data/main.db
      # - DUCKDB_AUTH_DATABASE_PATH=/data/auth.db
      # - DUCKDB_THREADS=8
      # - DUCKDB_MEMORY_LIMIT=4GB
      # - DUCKDB_QUERY_TIMEOUT=30s
      # - DUCKDB_ACCESS_MODE=read_write
      # - DUCKDB_MAX_ROWS_PER_PAGE=100
      # - DUCKDB_ABSOLUTE_MAX_ROWS=10000
      # FTS sidecar connection (uncomment to enable /find endpoint)
      # - DUCKDB_FTS_SERVICE_URL=http://fts-sidecar:8701
      # ggvisual sidecar connection (ggsql chart rendering -- documented for the compose
      # network wiring; not yet read by the module, see ggsql-endpoint.md)
      # - DUCKDB_GGVISUAL_SERVICE_URL=http://ggvisual:8080
      # CORS origins for browser clients like duck-ui (uncomment and set as needed)
      - DUCKDB_CORS_ORIGINS=http://localhost:5522
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${DUCKDB_PORT:-8080}${DUCKDB_ROUTE_PREFIX:-/duckdb}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    # Uncomment to enable FTS sidecar dependency
    # depends_on:
    #   fts-sidecar:
    #     condition: service_healthy

  # FTS Sidecar Service (optional - uncomment to enable full-text search)
  # Provides the /find endpoint for full-text search using LanceDB
  # fts-sidecar:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.fts-python
  #   container_name: fts-sidecar
  #   volumes:
  #     - duckdb-data:/data
  #   environment:
  #     - TZ=UTC
  #     - FTS_PORT=8701
  #     - FTS_INDEX_PATH=/data/fts
  #     - FTS_LOG_LEVEL=INFO  # DEBUG, INFO, WARNING, ERROR
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8701/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1G
  #       reservations:
  #         memory: 256M

  # ggvisual Sidecar Service (optional - uncomment to enable ggsql chart rendering)
  # Provides POST /render, POST /validate, GET /formats, GET /health, GET /version for
  # rendering ggsql (Grammar-of-Graphics SQL) visualizations -- see ggsql-endpoint.md.
  # Not yet consumed by this module's Go code (no HTTP client wired up); this block only
  # makes the service reachable on the compose network for that follow-on work.
  # Build first (not published to a registry):
  #   cd ../ggsql && podman build --target service -t localhost/ggvisual:latest -f Containerfile .
  # ggvisual:
  #   image: localhost/ggvisual:latest
  #   container_name: ggvisual
  #   environment:
  #     - TZ=UTC
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2G
  #       reservations:
  #         memory: 512M
  #   # No `ports:` entry -- reached only by service name (http://ggvisual:8080) on the
  #   # compose network, never published to the host. Matches ggsql-endpoint.md's "no
  #   # separate auth surface" stance: this module is the only intended caller.

volumes:
  duckdb-data:
    driver: local
