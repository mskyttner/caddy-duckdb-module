# examples/compose.yaml — DiVA OAI MCP server
#
# Exposes the DiVA OAI normalized database as an MCP server using an
# in-memory DuckDB that attaches the file in read-only mode via init.sql.
#
# One-time setup (run from the repo root):
#   mkdir -p examples/diva-data
#   ./tools/auth-db init -d examples/diva-data/auth.db
#   ./tools/auth-db key add -d examples/diva-data/auth.db -r admin
#   # Save the displayed API key!
#
#   # Kurathor — persistent curation database (DuckDB creates the file on first start)
#   mkdir -p examples/kurathor && chmod 777 examples/kurathor
#
# Start / stop:
#   podman-compose -f examples/compose.yaml up -d
#   podman-compose -f examples/compose.yaml down
#
# MCP endpoint: http://localhost:8099/duckdb/mcp
#   Use X-API-Key: <your-key> header for authentication.
#
# MCP docs: any *.md file in examples/docs/ is served as an MCP resource at
#   duckdb://docs/<stem>  (e.g. suhf-bibliometrics.md → duckdb://docs/suhf-bibliometrics)
# Add or edit files in examples/docs/ to provide deployment-specific guidance
# to LLMs without restarting the container (changes take effect on next startup).

services:
  diva-mcp:
    image: ghcr.io/mskyttner/caddy-duckdb-module
    container_name: diva-mcp
    ports:
      - "8099:8080"
    volumes:
      # Caddyfile — use the reference docker Caddyfile
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      # init.sql — attach + USE the diva database
      - ./init.sql:/data/init.sql:ro
      # DiVA database — read-only bind mount
      - ../../harvest-tools/diva/diva_oai_normalized.db:/data/diva/diva_oai_normalized.db:ro
      # auth.db directory (must be pre-initialized; see setup above)
      - ./diva-data:/data/auth
      # MCP docs — deployment-specific *.md files served as MCP resources.
      # Edit files in examples/docs/ and restart to update LLM guidance.
      - ./docs:/data/docs:ro
      # exports — must be world-writable so the caddy user (uid 999) can write files.
      # Rootless podman maps the container's caddy uid to "other" on the host directory,
      # so mode 755 (the default for mkdir) blocks writes. Fix: chmod o+w examples/exports
      # (i.e. mode 777). Run once after creating the directory:
      #   mkdir -p examples/exports && chmod 777 examples/exports
      - ./exports:/data/exports
      # kurathor.db — persistent read-write curation database.
      # DuckDB creates the file automatically on first start.
      # Must be world-writable for rootless podman (same reason as exports above).
      #   mkdir -p examples/kurathor && chmod 777 examples/kurathor
      - ./kurathor:/data/kurathor
    environment:
      - TZ=UTC
      # Use an in-memory main DB; all data comes from the attached diva DB
      - "DUCKDB_DATABASE_PATH=:memory:"
      - DUCKDB_AUTH_DATABASE_PATH=/data/auth/auth.db
      # Run init.sql on startup to ATTACH + USE diva
      - DUCKDB_INIT_FILE=/data/init.sql
      - DUCKDB_ACCESS_MODE=read_write
      - DUCKDB_QUERY_TIMEOUT=60s
      - DUCKDB_THREADS=4
      - DUCKDB_MAX_ROWS_PER_PAGE=100
      - DUCKDB_ABSOLUTE_MAX_ROWS=5000
      - DUCKDB_MAX_MCP_ROWS=200
      - DUCKDB_MCP_DOCS_DIR=/data/docs
      - DUCKDB_CORS_ORIGINS=*
      - DUCKDB_TEMP_DIRECTORY=/data/tmp
      - DUCKDB_EXPORTS_DIR=/data/exports
      - DUCKDB_EXPORTS_URL=http://localhost:8099/duckdb/exports
      - DUCKDB_MCP_DOCS_DIR=/data/docs
      - XDG_DATA_HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
    restart: unless-stopped
    healthcheck:
      test: "curl -fsS http://localhost:8080/duckdb/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
